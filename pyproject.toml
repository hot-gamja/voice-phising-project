[project]
name = "voice-phishing-detection"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate~=1.15.0",
    "datasets~=5.0.0",
    "fastapi~=0.141.0",
    "pydantic~=2.13.0",
    "scikit-learn~=1.9.0",
    "torch~=2.14.0",
    "transformers~=5.17.0",
    "uvicorn~=0.53.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest~=9.1.0",
    "websockets>=17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
